<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ShopEase FAQ Chatbot</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="chat">
    <header class="chat-header">
      <div class="avatar" aria-hidden="true">🤖</div>
      <div>
        <h1>ShopEase Assistant</h1>
        <p class="online">● Online &middot; answers questions from our FAQ</p>
      </div>
    </header>

    <section id="messages" class="messages" aria-live="polite">
      <div class="msg bot">
        <div class="bubble">Hi! 👋 I'm the ShopEase FAQ assistant. Ask me about orders, shipping, payments, returns or your account.</div>
      </div>
      <div class="chips">
        
        <button class="chip" type="button">How do I track my order?</button>
        
        <button class="chip" type="button">How long does shipping take?</button>
        
        <button class="chip" type="button">What is your return policy?</button>
        
        <button class="chip" type="button">What payment methods do you accept?</button>
        
        <button class="chip" type="button">When will I get my refund?</button>
        
        <button class="chip" type="button">How can I contact customer support?</button>
        
      </div>
    </section>

    <form id="form" class="composer" autocomplete="off">
      <input id="message" type="text" maxlength="500" placeholder="Type your question..." aria-label="Your question" autofocus>
      <button type="submit" aria-label="Send">Send</button>
    </form>
  </main>
  <p class="credit">NLTK preprocessing + TF-IDF cosine similarity &middot; CodeAlpha AI Internship &mdash; Task 2</p>

  <script src="engine.js"></script>
  <script src="app.js"></script>
</body>
</html>
